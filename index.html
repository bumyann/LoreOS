<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoreOS</title>
<meta name="description" content="Lorebook, character card, and preset editor for SillyTavern, JanitorAI & SaucepanAI">
<meta name="theme-color" content="#9d8fcc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoreOS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script src="vendor/lz-string.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<script>
// Apply saved custom fonts before first paint. settings.js applyFonts() used
// to be the first place they were applied, at the very end of init, so the
// default fonts flashed for a moment on every load.
(function () {
  try {
    var saved = JSON.parse(localStorage.getItem('aet_fonts') || '{}');
    var roles = { fp: '--fp', fx: '--fx', fb: '--fb' };
    var root = document.documentElement;
    Object.keys(roles).forEach(function (role) {
      var d = saved[role];
      if (!d || !d.name) return;
      if (d.type === 'gf') {
        var link = document.createElement('link');
        link.id = 'gf-font-' + role;
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=' + d.name.trim().replace(/ /g, '+') + '&display=swap';
        document.head.appendChild(link);
        root.style.setProperty(roles[role], "'" + d.name.trim() + "', sans-serif");
      } else if (d.type === 'upload' && d.dataUrl) {
        var ext = d.name.split('.').pop().toLowerCase();
        var fmt = ext === 'woff2' ? 'woff2' : ext === 'woff' ? 'woff' : 'truetype';
        var st = document.createElement('style');
        st.id = 'uploaded-font-' + role;
        st.textContent = "@font-face { font-family: 'CustomFont_" + role + "'; src: url('" + d.dataUrl + "') format('" + fmt + "'); }";
        document.head.appendChild(st);
        root.style.setProperty(roles[role], "'CustomFont_" + role + "', sans-serif");
      }
    });
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/components.css">
<script src="js/tiptap-bundle.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="app">

  <!-- ══ MOBILE TOP BAR ══ -->
  <div id="mob-topbar">
    <div class="mob-topbar-left">
      <span class="mob-topbar-title">LoreOS</span>
      <span id="mob-topbar-ver" class="mob-topbar-ver">Early Access</span>
    </div>
    <button id="mob-topbar-help" class="btn btn-icon" title="Help" style="display:none">?</button>
  </div>

  <!-- ══ NAV SIDEBAR ══ -->
  <nav id="nav-sidebar">
    <div class="nav-top">
      <div class="nav-logo">
        <span class="nav-logo-text">LoreOS</span>
        <span id="versionTag" class="nav-version">Early Access</span>
      </div>
      <button id="nav-toggle" class="nav-toggle" title="Collapse sidebar">◀</button>
    </div>

    <div class="nav-items">
      <button class="nav-item" data-view="home" title="Home">
        <span class="nav-item-icon">✦</span>
        <span class="nav-item-label">Home</span>
      </button>
      <button class="nav-item" data-view="library" title="Library">
        <span class="nav-item-icon">✦</span>
        <span class="nav-item-label">Library</span>
      </button>
      <button class="nav-item" data-view="notebook" title="Journal">
        <span class="nav-item-icon">✦</span>
        <span class="nav-item-label">Journal</span>
      </button>
      <button class="nav-item" data-view="editor" title="Workshop">
        <span class="nav-item-icon">✦</span>
        <span class="nav-item-label">Workshop</span>
      </button>
      <button class="nav-item" data-view="laboratory" title="Laboratory">
        <span class="nav-item-icon">✦</span>
        <span class="nav-item-label">Laboratory</span>
      </button>
    </div>

    <div class="nav-bottom">
      <button class="nav-item" data-view="settings" title="Settings">
        <span class="nav-item-icon">⚙</span>
        <span class="nav-item-label">Settings</span>
      </button>
      <button class="nav-item nav-item-icon-only" id="navThemeBtn" title="Toggle theme">
        <span class="nav-item-icon">◑</span>
        <span class="nav-item-label">Theme</span>
      </button>
    </div>
  </nav>

  <!-- ══ MAIN CONTENT AREA ══ -->
  <div id="content-area">

    <!-- ── HOME VIEW ── -->
    <div id="view-home" class="view-panel">
      <div id="home-content" class="view-scroll"></div>
    </div>

    <!-- ── LIBRARY VIEW ── -->
    <div id="view-library" class="view-panel">
      <div id="library-content" class="view-scroll"></div>
    </div>

    <!-- ── JOURNAL VIEW ── -->
    <div id="view-notebook" class="view-panel">
      <div id="notebook-content" style="flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0"></div>
    </div>

    <!-- ── LABORATORY VIEW ── -->
    <div id="view-laboratory" class="view-panel">
      <div id="laboratory-content" class="view-scroll"></div>
    </div>

    <!-- ── WORKSHOP VIEW ── -->
    <div id="view-editor" class="view-panel view-editor-layout">

      <!-- Editor header: lorebook name + mode-specific actions -->
      <header id="editor-header">
        <div id="editor-header-left">
          <span class="lb-label" id="nameLabel">Lorebook:</span>
          <input type="text" id="lorebookName" placeholder="untitled">
        </div>
        <div id="editor-header-right">
          <!-- LOREBOOK MODE ACTIONS -->
          <div class="hdr-actions mode-actions" id="hdr-lore">
            <div class="dd" id="dd-import">
              <button class="btn btn-p dd-btn">&#8659; Import</button>
              <div class="dd-menu">
                <button class="dd-item" id="importBtn">SillyTavern</button>
                <button class="dd-item" id="importJanitorPasteBtn">JanitorAI</button>
                <button class="dd-item" id="importSaucepanBtn">SaucepanAI</button>
                <button class="dd-item" id="importMergeBtn">Import for Merge</button>
              </div>
            </div>
            <div class="dd" id="dd-export">
              <button class="btn btn-s dd-btn">&#8657; Export</button>
              <div class="dd-menu">
                <button class="dd-item" id="exportJsonBtn">SillyTavern</button>
                <button class="dd-item" id="exportJanitorBtn">JanitorAI</button>
                <button class="dd-item" id="exportSaucepanBtn">SaucepanAI</button>
                <button class="dd-item" id="exportTxtBtn">Export as Text</button>
                <button class="dd-item" id="exportPubBtn">Export for Public Pages</button>
              </div>
            </div>
            <button class="btn btn-s" id="searchBtn2">Find &amp; Replace</button>
            <button class="btn btn-s" id="libraryBtn">Lorebook Library</button>
            <button class="btn btn-s" id="loreTemplatesBtn">Templates</button>
            <button class="btn btn-s lore-settings-btn" id="loreSettingsBtn">Global</button>
            <button class="btn btn-s" id="clearBtn">Clear</button>
            <button class="btn btn-ok" id="newEntryBtn">+ New Entry</button>
          </div>

          <!-- CHARACTER MODE ACTIONS -->
          <div class="hdr-actions mode-actions" id="hdr-char" style="display:none">
            <div class="dd" id="dd-charimport">
              <button class="btn btn-p dd-btn">&#8659; Import</button>
              <div class="dd-menu">
                <button class="dd-item" id="charImportJsonBtn">Import JSON Card</button>
                <button class="dd-item" id="charImportPngBtn">Import PNG Card</button>
                <button class="dd-item" id="charImportSaucepanBtn">Companion.json</button>
                <button class="dd-item" id="charImportCharxBtn">.charx (Lumiverse)</button>
              </div>
            </div>
            <div class="dd" id="dd-charexport-hdr">
              <button class="btn btn-s dd-btn">&#8657; Export</button>
              <div class="dd-menu">
                <button class="dd-item" id="charHdrExportJsonBtn">V3 JSON</button>
                <button class="dd-item" id="charHdrExportV2JsonBtn">V2 JSON</button>
                <button class="dd-item" id="charHdrExportV3PngBtn">V3 PNG</button>
                <button class="dd-item" id="charHdrExportPngBtn">V2 PNG</button>
                <button class="dd-item" id="charHdrExportSaucepanBtn">Companion (SaucepanAI)</button>
                <button class="dd-item" id="charHdrExportCharxBtn">.charx (Lumiverse)</button>
              </div>
            </div>
            <button class="btn btn-s" id="charLibraryBtn">Character Library</button>
            <button class="btn btn-s" id="charTemplatesBtn">Templates</button>
            <button class="btn btn-s" id="attachLbBtn">Attach Lorebook</button>
            <button class="btn btn-s" id="pronounToolBtn">Pronouns</button>
            <button class="btn btn-ok" id="charNewBtn">+ New Character</button>
          </div>

          <!-- PRESET MODE ACTIONS -->
          <div class="hdr-actions mode-actions" id="hdr-preset" style="display:none">
            <div class="dd" id="dd-presetimport">
              <button class="btn btn-p dd-btn">&#8659; Import</button>
              <div class="dd-menu">
                <button class="dd-item" id="presetImportBtn">Import Preset JSON</button>
              </div>
            </div>
            <button class="btn btn-s" id="presetHdrExportBtn">&#8657; Export JSON</button>
            <button class="btn btn-s" id="presetLibraryBtn">Preset Library</button>
            <button class="btn btn-s" id="presetTemplatesBtn">Prompt Library</button>
            <button class="btn btn-s" id="psAddPromptHdr">+ New Prompt</button>
            <button class="btn btn-ok" id="presetNewBtn">+ New Preset</button>
          </div>

          <!-- STUB MODE ACTIONS (persona / prompt / regex) -->
          <div class="hdr-actions mode-actions" id="hdr-persona" style="display:none"></div>
          <div class="hdr-actions mode-actions" id="hdr-prompt" style="display:none"></div>
          <div class="hdr-actions mode-actions" id="hdr-regex" style="display:none"></div>

          <button class="btn-icon btn mob-hide" id="helpBtn" title="Help">?</button>
        </div>
      </header>

      <!-- Workshop-level tabs (open items: lorebooks, chars, presets) -->
      <div id="workshopTabBar">
        <div id="workshopTabs"></div>
        <button id="workshopTabAdd" class="ws-tab-add" title="Open item">+</button>
      </div>

      <!-- Editor mode tabs -->
      <div id="modeTabs">
        <button class="mode-tab active" data-mode="lore">Lorebook</button>
        <button class="mode-tab" data-mode="char">Character</button>
        <button class="mode-tab" data-mode="persona">Persona</button>
        <button class="mode-tab" data-mode="preset">⚙ Preset</button>
        <button class="mode-tab" data-mode="prompt">Prompt</button>
        <button class="mode-tab" data-mode="regex">Regex</button>
      </div>

      <!-- Editor inner layout: entry sidebar + editor canvas -->
      <div id="editor-inner">
        <!-- Entry list sidebar (editor-scoped) -->
        <aside id="sidebar" class="sidebar">
          <div class="sb-head">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <div class="sb-title" id="sbTitle">// Entries</div>
              <button id="mob-sb-close" class="btn-icon btn" style="display:none;width:1.7rem;height:1.7rem;font-size:.9rem" title="Close sidebar">✕</button>
            </div>
            <input type="text" id="sbSearch" class="sb-search" placeholder="Search entries...">
            <div class="zoom-row" id="zoomRow">
              <button class="z-btn" id="zoomOut">-</button>
              <span id="zoomLabel">Normal</span>
              <button class="z-btn" id="zoomIn">+</button>
            </div>
          </div>
          <div class="sb-count"><span id="entryCount">0 entries</span></div>
          <ul id="entryList"></ul>
        </aside>

        <!-- Mobile sidebar backdrop -->
        <div id="mob-backdrop"></div>

        <!-- Editor canvas -->
        <main id="editor-area">
          <div class="tab-bar-wrap">
            <div id="tabBar"></div>
            <div class="view-ctrls">
              <button class="btn-icon btn" id="viewToggle" title="Toggle side-by-side">▥</button>
              <button class="btn-icon btn" id="clearSel" title="Clear selection" style="display:none;font-size:.65rem;width:auto;padding:0 .4rem">☑ Clear</button>
            </div>
          </div>
          <div id="editorContent">
            <div class="empty-state">
              <div>// select an entry to begin</div>
              <button class="btn btn-ok" id="newEntryBtnAlt">+ New Entry</button>
            </div>
          </div>
        </main>
      </div>
    </div>

  </div><!-- /content-area -->
</div><!-- /app -->

<!-- Dialogs, hidden file inputs, the phone nav and the pronoun tool are injected by the
     feature modules that own them (see "MARKUP" at the bottom of each js file). -->
<script>
// The app is built from ES modules, which browsers refuse to load from a file://
// page (double-clicking index.html). Say so instead of leaving a blank screen.
if (location.protocol === 'file:') {
  document.addEventListener('DOMContentLoaded', function () {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0d1121;color:#e8e4f5;font-family:sans-serif;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;line-height:1.6';
    d.innerHTML = '<div style="max-width:30rem"><h2 style="margin:0 0 .75rem">LoreOS needs a local server</h2>' +
      '<p>Browsers block this kind of app when it is opened straight from a file.</p>' +
      '<p><b>Windows:</b> double-click <code>start.bat</code><br><b>Mac / Linux:</b> run <code>bash start.sh</code><br>' +
      'or just use <a href="https://loreos.net" style="color:#9d8fcc">loreos.net</a>.</p></div>';
    document.body.appendChild(d);
  });
}
</script>
<!-- App code: native ES modules. main.js imports the rest and starts the app. -->
<script type="module" src="js/main.js"></script>
<noscript><div style="padding:2rem;font-family:sans-serif;color:#e8e4f5">LoreOS needs JavaScript.</div></noscript>
</body>
</html>
